<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">

  <!-- biz:head -->
  <!-- /biz:head -->

  <!-- Business (AutoBodyShop) + this service (Service, BreadcrumbList, FAQPage) -->
  <!-- biz:schema -->
  <!-- /biz:schema -->
  {{service_schema}}

  <link rel="preload" href="/design-system/fonts/manrope-greek.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/design-system/fonts.css">
  <link rel="stylesheet" href="/design-system/tokens.css">
  <link rel="stylesheet" href="/design-system/components/bundle.css">
  <link rel="stylesheet" href="/css/site.css">
  <link rel="stylesheet" href="/css/animations.css">
  <script src="/js/parallax.js" defer></script>
  <script src="/js/animations.js" defer></script>
  <script src="/js/site.js" defer></script>
</head>
<body>
  <!-- SERVICE PAGE. Generated by scripts/build.py from templates/service.html + data/services.json.
       Edit those two files, not this one: it is rewritten on every build. -->

  <section class="fb-photo fb-hero page-hero service-hero">
    {{hero_picture}}
    <!-- biz:header -->
    <!-- /biz:header -->
    <div class="fb-hero-body">
      <h1 class="fb-hero-title">{{h1}}</h1>
      <div>
        <p class="fb-hero-lead">{{lead}}</p>
        <div class="fb-row">
          <a class="fb-btn fb-btn-primary" href="{{estimate_href}}">Ζητήστε εκτίμηση</a>
        </div>
      </div>
    </div>
  </section>

  <nav class="breadcrumb" aria-label="Διαδρομή">
    <div class="container">
      <ol>
        <li><a href="/">Αρχική</a></li>
        <li><a href="/#ypiresies">Υπηρεσίες</a></li>
        <li aria-current="page">{{breadcrumb}}</li>
      </ol>
    </div>
  </nav>

  <main>
    <article class="service-article">
      <div class="container">
        <div class="service-content">
{{content}}
        </div>
      </div>
    </article>

{{cta}}

    <section class="section other-services" aria-labelledby="other-title">
      <div class="container">
        <h2 class="fb-heading-xl" id="other-title">Άλλες υπηρεσίες</h2>
        <div class="services-grid services-grid--two" data-reveal-group>
{{other_cards}}
        </div>
      </div>
    </section>
  </main>

  <!-- biz:footer -->
  <!-- /biz:footer -->

  <!-- biz:chat -->
  <!-- /biz:chat -->
</body>
</html>
